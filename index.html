<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <script>
      const theme = localStorage.getItem('theme') || 'dark'
      const language = localStorage.getItem('language') || 'en'
      document.documentElement.dataset.theme = theme
      document.documentElement.lang = language
      document.documentElement.dir = language === 'ar-SA' ? 'rtl' : 'ltr'
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#050505' : '#f3f1eb'
    </script>
    <meta name="description" content="Portfolio of Yohanes Pratama Naibaho, a software engineer building scalable systems across the stack." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <title>Yohanes Pratama Naibaho — Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
